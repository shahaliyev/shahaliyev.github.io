<div id="giscus-container" class="giscus-container"></div>
<script>
(function () {
  var host = document.getElementById("giscus-container");
  if (!host) return;

  var loaded = false;
  function loadGiscus() {
    if (loaded) return;
    loaded = true;
    var s = document.createElement("script");
    s.src = "https://giscus.app/client.js";
    s.async = true;
    s.crossOrigin = "anonymous";
    s.setAttribute("data-repo", "shahaliyev/shahaliyev.github.io");
    s.setAttribute("data-repo-id", "R_kgDOK_qyzg");
    s.setAttribute("data-category", "Announcements");
    s.setAttribute("data-category-id", "DIC_kwDOK_qyzs4CkG4R");
    s.setAttribute("data-mapping", "pathname");
    s.setAttribute("data-strict", "0");
    s.setAttribute("data-reactions-enabled", "1");
    s.setAttribute("data-emit-metadata", "0");
    s.setAttribute("data-input-position", "bottom");
    s.setAttribute("data-theme", "preferred_color_scheme");
    s.setAttribute("data-lang", "en");
    host.appendChild(s);
  }

  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      if (entries.some(function (e) { return e.isIntersecting; })) {
        io.disconnect();
        loadGiscus();
      }
    }, { rootMargin: "400px 0px" });
    io.observe(host);
  } else {
    window.addEventListener("load", loadGiscus);
  }
})();
</script>
