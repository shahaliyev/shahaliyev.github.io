# Site settings
baseurl: ""
url: "https://shahaliyev.org"
github_username: shahaliyev

author: 
  en: Ismayil Shahaliyev
  az: İsmayıl Şahəliyev

title: 
  en: Ismayil Shahaliyev
  az: İsmayıl Şahəliyev

description:
  en: Computer Scientist | International Chess Master
  az: Kompüter Alimi | Beynəlxalq Şahmat Ustası

nav:
  home: 
    en: Home
    az: Ana səhifə
  writings: 
    en: Writings
    az: Yazılar


collections:
  posts:
    output: true
    permalink: /writings/:title
  notes:
    output: true
    permalink: /notes/:slug/
  research:
    output: false
    permalink: /research/:slug/
  teaching:
    output: false
    permalink: /teaching/:slug/


defaults:
  -
    scope:
      path: ""
    values:
      lang: "en"
  -
    scope:
      path: "_posts"
    values:
      layout: "post"
  -
    scope:
      path: "_posts/az"
    values:
      lang: "az"
      permalink: "/az/writings/:title"
  -
    scope:
      path: "az"
    values:
      lang: "az"
  -
    scope:
      path: "_notes"
    values:
      layout: "note_content"
      lang: "en"
  -
    scope:
      path: "_research"
    values:
      lang: "en"
  -
    scope:
      path: "_teaching"
    values:
      lang: "en"


# Build settings
theme:
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Combined writings + notes Atom feed lives in /feed.xml (custom).
# jekyll-feed is not used because it cannot merge collections into one feed.

markdown: kramdown
kramdown:
  input: GFM

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# Underscore-prefixed files are skipped unless listed here (_headers for CF/Netlify).
include:
  - _headers

exclude:
  - notes/

